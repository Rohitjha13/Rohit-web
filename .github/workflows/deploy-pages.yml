name: Deploy Rohit website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website files
        run: |
          mkdir -p .pages-site/assets .pages-site/admin
          cp index.html admin.html .pages-site/
          cp -R admin assets .pages-site/
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
